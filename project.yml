name: LocalSeek
options:
  bundleIdPrefix: com.localseek
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.11.1"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: "0.9.20"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    ARCHS: arm64
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: "1.3.0"
    OTHER_CFLAGS: ["$(inherited)", "-ffile-prefix-map=$(SRCROOT)=/LocalSeek"]
    OTHER_CPLUSPLUSFLAGS: ["$(inherited)", "-ffile-prefix-map=$(SRCROOT)=/LocalSeek"]
    OTHER_SWIFT_FLAGS: ["$(inherited)", "-debug-prefix-map", "$(SRCROOT)=/LocalSeek", "-file-prefix-map", "$(SRCROOT)=/LocalSeek"]
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"

targets:

  # Pinned static llama/ggml libraries; no Homebrew runtime dependency.
  LlamaBridge:
    type: library.static
    platform: macOS
    sources:
      - LlamaBridge
    settings:
      base:
        PRODUCT_MODULE_NAME: LlamaBridge
        DEFINES_MODULE: YES
        MODULEMAP_FILE: LlamaBridge/include/module.modulemap
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/build/Native/include
          - $(SRCROOT)/LlamaBridge/include

  # Shared extraction, search, models, and SQLite persistence via GRDB.
  SharedCore:
    type: framework
    platform: macOS
    sources:
      - Shared
    dependencies:
      - package: GRDB
        product: GRDB
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: LlamaBridge
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localseek.shared
        DEFINES_MODULE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LlamaBridge/include
        OTHER_LDFLAGS: [-lc++]

  # Vision is isolated so a native OCR stall can be killed without losing the queue.
  LocalSeekOCR:
    type: tool
    platform: macOS
    sources:
      - Apps/LocalSeekOCR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localseek.ocr
        SKIP_INSTALL: YES

  # SwiftUI menu bar app; OCR runs in a bounded helper process.
  LocalSeek:
    type: application
    platform: macOS
    sources:
      - Apps/LocalSeek
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: SharedCore
        embed: true
      - target: LlamaBridge
      - target: LocalSeekOCR
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localseek.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_FILE: Apps/LocalSeek/Info.plist
        LOCALSEEK_UPDATE_CHANNEL: stable
        INFOPLIST_KEY_NSHumanReadableCopyright: "LocalSeek"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LlamaBridge/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/build/Native/lib
        OTHER_LDFLAGS:
          - -lc++
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -lggml-metal
          - -lggml-blas
          - -framework Accelerate
          - -framework Metal
          - -framework Foundation
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  # Unit and integration tests for SharedCore and app coordination.
  LocalSeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UnitTests
      - Apps/LocalSeek/IndexService.swift
      - Apps/LocalSeek/LlamaEmbeddingProvider.swift
      - Apps/LocalSeek/ModelLocator.swift
      - Apps/LocalSeek/SettingsWindowController.swift
      - Apps/LocalSeek/UpdateController.swift
      - Apps/LocalSeek/SparkleUpdateEngine.swift
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: SharedCore
      - target: LlamaBridge
      - target: LocalSeekOCR
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localseek.tests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/LlamaBridge/include
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/build/Native/lib
        OTHER_LDFLAGS:
          - -lc++
          - -lllama
          - -lggml
          - -lggml-base
          - -lggml-cpu
          - -lggml-metal
          - -lggml-blas
          - -framework Accelerate
          - -framework Metal
          - -framework Foundation
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)

schemes:
  LocalSeek:
    build:
      targets:
        LocalSeek: all
        SharedCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalSeekTests
