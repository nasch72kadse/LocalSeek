name: Feature request
description: Suggest an improvement to LocalSeek.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task or limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the improvement would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
